
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | SODA</title>
  <link rel="stylesheet" href="/styles.css" />

  <style>
    .field-hint {
      display: block;
      margin-top: 7px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .field-hint.error {
      color: #ffb5b5;
    }
  </style>
</head>

<body>

  <div class="app-shell">

    <div class="screen cadastro">

      <a class="top-link" href="/inicio">← Voltar</a>

      <div class="welcome">
        <h2>Crie sua conta</h2>
        <p>Preencha os dados para acessar o SODA</p>
      </div>

      <form id="cadastroForm">

        <!-- PERFIL -->
        <div class="form-group">

          <label for="tipoUsuario">
            Perfil de acesso
          </label>

          <select
            id="tipoUsuario"
            class="select"
            name="tipoUsuario"
          >
            <option value="aluno">Aluno</option>
            <option value="professor">Professor</option>
            <option value="servidor">Servidor</option>
            <option value="coordenador">Coordenador</option>
          </select>

          <small class="field-hint">
            Selecione o perfil que corresponde à sua função na instituição.
          </small>

        </div>

        <!-- CAMPOS EXTRAS -->
        <div id="camposExtras"></div>

        <!-- NOME -->
        <div class="form-group">

          <label for="nome">
            Nome completo
          </label>

          <input
            id="nome"
            class="input"
            type="text"
            name="nome"
            placeholder="Digite seu nome completo"
            required
          />

          <small class="field-hint">
            Informe seu nome completo.
          </small>

        </div>

        <!-- EMAIL -->
        <div class="form-group">

          <label for="email">
            E-mail institucional
          </label>

          <input
            id="email"
            class="input"
            type="email"
            name="email"
            placeholder="seu@email.edu.br"
            required
          />

          <small class="field-hint">
            Utilize seu e-mail institucional para realizar o cadastro.
          </small>

        </div>

        <!-- SENHA -->
        <div class="form-group">

          <label for="senha">
            Senha
          </label>

          <input
            id="senha"
            class="input"
            type="password"
            name="senha"
            placeholder="Crie uma senha"
            minlength="8"
            required
          />

          <small class="field-hint">
            A senha deve ter no mínimo 8 caracteres.
          </small>

        </div>

        <!-- CONFIRMAR SENHA -->
        <div class="form-group">

          <label for="confirmarSenha">
            Confirmar senha
          </label>

          <input
            id="confirmarSenha"
            class="input"
            type="password"
            name="confirmarSenha"
            placeholder="Repita a senha"
            minlength="8"
            required
          />

          <small class="field-hint">
            Digite novamente a senha para confirmar.
          </small>

        </div>

        <!-- MENSAGEM -->
        <div
          id="statusMessage"
          class="status-message"
          aria-live="polite"
        ></div>

        <!-- BOTÃO -->
        <button
          class="primary-btn"
          type="submit"
        >
          Cadastrar
        </button>

      </form>

    </div>

  </div>

  <script>

    const camposExtras =
      document.getElementById('camposExtras');

    const tipoUsuario =
      document.getElementById('tipoUsuario');

    /*
     * Campos específicos de cada perfil
     */
    const camposPorPerfil = {

      aluno: [
        {
          name: 'matricula',
          label: 'Matrícula acadêmica',
          type: 'text',
          placeholder: 'Digite sua matrícula'
        },
        {
          name: 'curso',
          label: 'Curso',
          type: 'text',
          placeholder: 'Digite o curso'
        },
        {
          name: 'periodo',
          label: 'Período / semestre',
          type: 'text',
          placeholder: 'Ex.: 3º período'
        }
      ],

      professor: [
        {
          name: 'matricula',
          label: 'Matrícula',
          type: 'text',
          placeholder: 'Digite sua matrícula'
        },
        {
          name: 'disciplina',
          label: 'Disciplina',
          type: 'text',
          placeholder: 'Digite a disciplina'
        }
      ],

      servidor: [
        {
          name: 'matricula',
          label: 'Matrícula',
          type: 'text',
          placeholder: 'Digite sua matrícula'
        },
        {
          name: 'cargo',
          label: 'Cargo',
          type: 'text',
          placeholder: 'Ex.: Analista administrativo'
        }
      ],

      coordenador: [
        {
          name: 'matricula',
          label: 'Matrícula',
          type: 'text',
          placeholder: 'Digite sua matrícula'
        },
        {
          name: 'curso',
          label: 'Curso coordenado',
          type: 'text',
          placeholder: 'Digite o curso'
        }
      ]

    };


    /*
     * Cria os campos específicos
     * de acordo com o perfil escolhido
     */
    function renderCampos(tipo) {

      const campos =
        camposPorPerfil[tipo] || [];

      camposExtras.innerHTML = campos.map((campo) => `

        <div class="form-group">

          <label for="${campo.name}">
            ${campo.label}
          </label>

          <input
            id="${campo.name}"
            class="input"
            type="${campo.type}"
            name="${campo.name}"
            placeholder="${campo.placeholder}"
            required
          />

          <small class="field-hint">
            Preencha este campo com suas informações institucionais.
          </small>

        </div>

      `).join('');
    }


    /*
     * Atualiza os campos quando
     * o perfil é alterado
     */
    tipoUsuario.addEventListener('change', (event) => {

      renderCampos(event.target.value);

    });


    /*
     * Carrega os campos inicialmente
     */
    renderCampos(tipoUsuario.value);


    /*
     * Envio do formulário
     */
    document
      .getElementById('cadastroForm')
      .addEventListener('submit', async (event) => {

        event.preventDefault();

        const form = event.target;

        const data =
          Object.fromEntries(
            new FormData(form).entries()
          );

        const status =
          document.getElementById('statusMessage');


        /*
         * Verifica se as senhas são iguais
         */
        if (data.senha !== data.confirmarSenha) {

          status.textContent =
            'As senhas não coincidem.';

          status.classList.add('error');

          return;
        }


        /*
         * Verifica o tamanho da senha
         */
        if (data.senha.length < 8) {

          status.textContent =
            'A senha deve ter no mínimo 8 caracteres.';

          status.classList.add('error');

          return;
        }


        /*
         * Verifica se o e-mail parece institucional
         */
        if (
          !data.email.endsWith('.edu.br')
        ) {

          status.textContent =
            'Utilize um e-mail institucional terminado em .edu.br.';

          status.classList.add('error');

          return;
        }


        status.textContent =
          'Cadastrando...';

        status.classList.remove('error');


        /*
         * Dados que serão enviados
         * para o backend
         */
        const payload = {

          nome: data.nome,

          email: data.email,

          senha: data.senha,

          tipoUsuario: data.tipoUsuario,

          matricula:
            data.matricula || null,

          curso:
            data.curso || null,

          periodo:
            data.periodo || null,

          disciplina:
            data.disciplina || null,

          siape: null,

          cargo:
            data.cargo || null

        };


        try {

          /*
           * Envia os dados para o backend
           */
          const response =
            await fetch(
              '/usuarios/cadastro',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify(payload)
              }
            );


          const result =
            await response.json();


          /*
           * Verifica se houve erro
           */
          if (!response.ok) {

            throw new Error(
              result.erro ||
              'Não foi possível concluir o cadastro'
            );

          }


          /*
           * Cadastro realizado
           */
          status.textContent =
            result.mensagem ||
            'Cadastro realizado com sucesso!';

          status.classList.remove('error');


          form.reset();

          renderCampos(
            tipoUsuario.value
          );


          /*
           * Redireciona para o login
           */
          setTimeout(() => {

            window.location.href =
              '/login';

          }, 700);


        } catch (error) {

          status.textContent =
            error.message;

          status.classList.add('error');

        }

      });

  </script>

</body>

</html>
